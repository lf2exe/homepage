<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝術家作品集 | 質感深色版</title>
    
    <!-- 引入 Swiper CSS (滑動套件) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- 引入我們自定義的 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="#">首頁</a>
            <a href="#" id="about-link">自我介紹</a>
        </nav>
    </header>

    <main>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="gallery-wrapper">
                <!-- 內容將由 script.js 動態生成 -->
            </div>
        </div>
    </main>

    <!-- 作品詳情彈窗 (Modal) -->
    <div class="modal-overlay" id="modal">
        <span class="close-btn" id="close-modal">&times;</span>
        <div class="modal-content">
            <div class="modal-left">
                <img id="modal-img" src="" alt="作品大圖">
            </div>
            <div class="modal-right">
                <div class="info-row">
                    <span class="info-label">作品名稱</span>
                    <h2 id="modal-title"></h2>
                </div>
                <div class="info-row">
                    <span class="info-label">尺寸</span>
                    <span id="modal-size"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">創作理念</span>
                    <p id="modal-concept"></p>
                </div>
                <div class="info-row">
                    <span class="info-label">收藏狀態</span>
                    <span id="modal-status"></span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        2026年 05月 &nbsp; | &nbsp; 藝術家個人作品集存檔
    </footer>

    <!-- 引入外部套件與自定義 JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
